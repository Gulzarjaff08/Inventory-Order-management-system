version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventory_db_container
    ports:
      - "${PORT_DB}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend_container
    ports:
      - "${PORT_BACKEND}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${PORT_BACKEND}
    container_name: inventory_frontend_container
    ports:
      - "${PORT_FRONTEND}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    name: inventory_pgdata
